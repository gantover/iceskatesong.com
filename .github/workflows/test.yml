name: test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: iceskatesong
          POSTGRES_PASSWORD: iceskatesong
          POSTGRES_DB: iceskatesong
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 15
    env:
      DATABASE_URL: postgres://iceskatesong:iceskatesong@localhost:5432/iceskatesong
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm check
        working-directory: web
      # Also regenerates db-types.ts from the migrations: a diff means it wasn't committed with one.
      - run: pnpm test && git diff --exit-code src/lib/server/db-types.ts
        working-directory: web
      - run: uv run pytest
        working-directory: import
